<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phoenix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <canvas id="graph"></canvas>

  <div id="brand">
    <span class="dot"></span>
    <span class="name">PHOENIX</span>
    <span class="badge" id="sourceBadge">DEMO</span>
  </div>

  <div id="toolbar" class="panel">
    <button id="btnFit" title="Fit graph to view">◎ Fit</button>
    <button id="btnLabels" class="on" title="Toggle labels">Aa</button>
    <button id="btnPulse" class="on" title="Toggle idle pulse">◐</button>
  </div>

  <aside id="left" class="panel">
    <section id="inspector">
      <div class="eyebrow">Inspector</div>
      <div class="body" id="inspectorBody">
        Click a node to focus it. Shift-click a second to trace the path.
      </div>
    </section>
    <section id="hubs">
      <div class="eyebrow">Top hubs</div>
      <div id="hubList"></div>
    </section>
    <div class="hint">drag &middot; scroll to zoom &middot; shift-click to trace</div>
  </aside>

  <aside id="right" class="panel">
    <div class="eyebrow">Filter</div>
    <div id="filterList"></div>
  </aside>

  <div id="reactor" class="panel">
    <canvas id="reactorCanvas" width="150" height="150"></canvas>
    <div id="reactorState">idle</div>
  </div>

  <div id="stream"></div>

  <div id="dock" class="panel">
    <form id="askForm" autocomplete="off">
      <span class="lead">Ask</span>
      <input id="ask" placeholder="&ldquo;brief me&rdquo;" />
    </form>
    <button class="dock-btn mic" id="btnMic" title="Hold a conversation (mic)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
    </button>
    <button class="dock-btn wake" id="btnWake" title="Hands-free — say &ldquo;Hi Phoenix&rdquo; to wake">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12h3l2-6 3 12 3-9 2 5h3"/><path d="M20 9v6"/></svg>
    </button>
    <button class="dock-btn mute" id="btnMute" title="Mute / stop speaking (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
    </button>
    <button class="dock-btn" id="btnBrief" title="Brief me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </button>
    <button class="dock-btn" id="btnPlan" title="Plan my day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
    </button>
    <button class="dock-btn" id="btnMem" title="What do you remember?">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a4 4 0 0 1 4 4 4 4 0 0 1 0 8 4 4 0 0 1-8 0 4 4 0 0 1 0-8 4 4 0 0 1 4-4Z"/></svg>
    </button>
  </div>

  <div id="badges"></div>

  <script src="/ui/graph.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
