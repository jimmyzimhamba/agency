<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Agency Command</title>
<meta name="description" content="Agency Command — sales outreach and team-sync command center" />

<!-- Applies the saved light/dark preference (js/theme.js) to <html> before
     the stylesheet below is even requested, so a returning user in light
     mode never sees a flash of the default dark theme on load. -->
<script>
  (function () {
    try {
      if (localStorage.getItem("sxc-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>

<!-- Installable app config -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0d" />
<meta name="background-color" content="#0a0a0d" />

<!-- iOS "Add to Home Screen" behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agency Command" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />

<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="ambient-glow a"></div>
  <div class="ambient-glow b"></div>
  <div class="grain"></div>
  <div class="toast-wrap"></div>

  <div id="app">

    <!-- ============ AUTH SCREEN ============ -->
    <div id="auth-screen" class="auth-wrap" style="display:none;">
      <div class="auth-logo">
        <div class="ring"><img src="icons/mark.png" alt="" /></div>
        <h1><span class="text-purple-grad">Agency</span> Command</h1>
        <p>SALES &amp; TEAM SYNC COMMAND CENTER</p>
      </div>

      <div class="card glow-card" style="max-width:360px;margin:0 auto;width:100%;">
        <div id="auth-error" class="hint" style="color:var(--danger);display:none;margin-bottom:10px;"></div>

        <div id="auth-agency-mode-row" class="subtabs" style="display:none;">
          <div class="subtab active" id="auth-agency-create-tab" data-agency-mode="create">New agency</div>
          <div class="subtab" id="auth-agency-join-tab" data-agency-mode="join">Join a team</div>
        </div>

        <div class="field">
          <label>Full name</label>
          <input id="auth-name" type="text" placeholder="Tariro Moyo" autocomplete="name" />
        </div>
        <div class="field" id="auth-agency-name-field" style="display:none;">
          <label>Agency name</label>
          <input id="auth-agency-name" type="text" placeholder="Studio X Marketing" autocomplete="organization" />
        </div>
        <div class="field" id="auth-invite-code-field" style="display:none;">
          <label>Invite code</label>
          <input id="auth-invite-code" type="text" placeholder="Ask your team owner for this" autocomplete="off" />
        </div>
        <div class="field">
          <label>Email</label>
          <input id="auth-email" type="email" placeholder="you@studioxmarketing.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="auth-password" type="password" placeholder="At least 6 characters" autocomplete="current-password" />
        </div>

        <button id="auth-submit" class="btn btn-primary" style="margin-top:4px;">Sign In</button>
        <div id="auth-loading" class="spinner" style="display:none;"></div>
      </div>

      <div class="auth-toggle">
        <span id="auth-mode-hint">New to Agency Command?</span>
        <b id="auth-mode-toggle">Create account</b>
      </div>
    </div>

    <!-- ============ APP SHELL ============ -->
    <div id="app-shell" style="display:none;">
      <div class="app-layout">

        <!-- desktop/tablet sidebar — hidden on phone widths, replaces the
             bottom nav once there's room for a persistent rail. -->
        <nav class="app-sidebar" id="app-sidebar">
          <div class="sidebar-brand">
            <div class="brand-mark"><img src="icons/mark.png" alt="" /></div>
            <div class="brand-name"><span class="text-purple-grad">Agency</span> Command<small id="sidebar-org-name">HARARE OUTREACH</small></div>
          </div>

          <div class="sidebar-search">
            <div class="search-bar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="global-search-input" type="text" placeholder="Search everything..." autocomplete="off" />
            </div>
            <div id="global-search-results" class="gsearch-dropdown"></div>
          </div>

          <div class="sidebar-scroll">
            <div class="sidebar-group-label">Overview</div>
            <button class="sidebar-link" data-view="dashboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M12 19V5M20 19v-7"/></svg>
              Dashboard
            </button>

            <div class="sidebar-group-label">Pipeline</div>
            <button class="sidebar-link" data-view="pipeline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
              Prospects
            </button>
            <button class="sidebar-link" data-view="discovery">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              Discovery
            </button>
            <button class="sidebar-link" data-view="tasks">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg>
              Tasks
            </button>
            <button class="sidebar-link" data-view="messages">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Messages
            </button>

            <div class="sidebar-group-label">Strategy</div>
            <button class="sidebar-link" data-view="niches">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
              Niche Matrix
            </button>
            <button class="sidebar-link" data-view="pipelinevalue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
              Pipeline Value
            </button>
            <button class="sidebar-link" id="sidebar-deal-pricing">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 12h2M12 12h2M16 12h2M8 16h2M12 16h2M16 16h2"/></svg>
              Deal Pricing
            </button>

            <div class="sidebar-group-label">Business</div>
            <button class="sidebar-link" data-view="contracts">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>
              Contracts
            </button>
            <button class="sidebar-link" data-view="invoices">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
              Invoices
            </button>
            <button class="sidebar-link" data-view="projects">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
              Projects
            </button>
            <button class="sidebar-link" data-view="gridplans">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              Grid Plans
            </button>
            <button class="sidebar-link" data-view="services">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-4V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1Z"/><path d="M10 5h4v2h-4z"/></svg>
              Services &amp; Packages
            </button>
            <button class="sidebar-link" data-view="portfolio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m3 15 4.5-4.5a2 2 0 0 1 2.8 0L15 15M13 13l2-2a2 2 0 0 1 2.8 0L21 14"/><circle cx="8" cy="8.5" r="1.3"/></svg>
              Portfolio Studio
            </button>

            <div class="sidebar-group-label">Team</div>
            <button class="sidebar-link" data-view="community">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              Community Feed
            </button>
            <button class="sidebar-link" data-view="activity">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
              Activity Feed
            </button>
            <button class="sidebar-link" data-view="team">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20.5c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6"/><path d="M16 4.6c1.6.5 2.8 2 2.8 3.8s-1.2 3.3-2.8 3.8"/><path d="M17.5 14.7c2.6.6 4.5 2.7 4.5 5.3"/></svg>
              Team &amp; Settings
            </button>
          </div>

          <button class="sidebar-foot" id="sidebar-foot">
            <span id="sidebar-avatar-slot" style="display:inline-flex;width:32px;height:32px;flex:0 0 auto;"></span>
            <div class="sidebar-foot-text">
              <div class="sidebar-foot-name" id="sidebar-user-name">&nbsp;</div>
              <div class="sidebar-foot-role" id="sidebar-user-role">&nbsp;</div>
            </div>
            <span id="sidebar-due-badge" class="badge-dot" style="display:none;position:static;border:none;">0</span>
          </button>
        </nav>

        <div class="app-main-col">
          <div class="topbar">
            <div class="brand">
              <div class="brand-mark"><img src="icons/mark.png" alt="" /></div>
              <div class="brand-name"><span class="text-purple-grad">Agency</span> Command<small id="topbar-org-name">HARARE OUTREACH</small></div>
            </div>
            <div class="topbar-actions">
              <button class="icon-btn" id="btn-search" title="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              </button>
              <button class="icon-btn" id="btn-due" title="Due today">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/></svg>
                <span id="due-badge" class="badge-dot" style="display:none;">0</span>
              </button>
              <button class="icon-btn" id="btn-theme" title="Toggle light/dark mode">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
              </button>
              <button class="icon-btn" id="btn-profile" title="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
            </div>
          </div>
          <div id="offline-banner" class="offline-banner">You're offline — showing the last synced data</div>

          <main>
            <div id="view-pipeline" class="view"></div>
            <div id="view-discovery" class="view"></div>
            <div id="view-dashboard" class="view"></div>
            <div id="view-tasks" class="view"></div>
            <div id="view-messages" class="view"></div>
            <div id="view-niches" class="view"></div>
            <div id="view-community" class="view"></div>
            <div id="view-activity" class="view"></div>
            <div id="view-team" class="view"></div>
            <div id="view-pipelinevalue" class="view"></div>
            <div id="view-contracts" class="view"></div>
            <div id="view-invoices" class="view"></div>
            <div id="view-projects" class="view"></div>
            <div id="view-gridplans" class="view"></div>
            <div id="view-services" class="view"></div>
            <div id="view-portfolio" class="view"></div>
          </main>

          <button class="fab" id="fab-add" title="Add prospect">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          </button>

          <nav class="bottom-nav">
            <button class="nav-btn" data-view="dashboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M12 19V5M20 19v-7"/></svg>
              Dashboard
            </button>
            <button class="nav-btn" data-view="pipeline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
              Pipeline
            </button>
            <button class="nav-btn" data-view="tasks">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg>
              Tasks
            </button>
            <button class="nav-btn" data-view="messages">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Messages
            </button>
            <button class="nav-btn" data-view="more">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
              More
            </button>
          </nav>
        </div>
      </div>
    </div>

    <div class="center-loading" id="boot-loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- generic bottom sheet used by prospect detail, add/edit forms, more-menu, due-today -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-title">&nbsp;</div>
      <button class="sheet-close" id="sheet-close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- generic small modal used for confirmations -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <!-- hidden letterhead document filled in by printDoc.js right before
       window.print() is called; @media print in styles.css hides everything
       else on the page so only this prints (or gets "saved as PDF"). -->
  <div id="print-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
