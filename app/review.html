<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Review your grid plan</title>
<meta name="description" content="Review and approve your upcoming social media posts" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="ambient-glow a"></div>
  <div class="ambient-glow b"></div>
  <div class="grain"></div>
  <div class="toast-wrap"></div>

  <div id="app">
    <div id="review-root" class="review-page-wrap"></div>
  </div>

  <!-- Same minimal modal shell as the main app (app/app.html), just for
       this one page — see js/review.js's own tiny openModal/closeModal. -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- Realtime only (presence + broadcast pings for live sync/soft-lock
       indicators) — this page never calls .from()/.storage on this client;
       all actual data access stays exclusively through the review-* Edge
       Functions in js/review.js, over plain fetch() with the anon key. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/review.js"></script>
</body>
</html>
