<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Your dashboard</title>
<meta name="description" content="Reports, invoices, and updates from your agency" />
<!-- noindex for the same reason review.html/project.html carry it: the link
     is the credential, and a page that turns up in a search result is a
     link that leaked. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="ambient-glow a"></div>
  <div class="ambient-glow b"></div>
  <div class="grain"></div>
  <div class="toast-wrap"></div>

  <div id="app">
    <div id="portal-root" class="review-page-wrap"></div>
  </div>

  <!-- Same minimal modal shell as review.html, needed here too now that the
       content calendar section (grid plan posts) opens a tap-to-expand
       modal for approving a post or requesting changes, see the
       openModal/closeModal pair in js/clientPortal.js. -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- Same reasoning as project.html: read-only for almost everything, the
       two writes this page allows (feedback, and now approving/requesting
       changes on a grid plan post) are narrow enough to go straight to a
       database function or the existing review-* Edge Function over plain
       fetch(), no Supabase client library needed. -->
  <script type="module" src="js/clientPortal.js"></script>
</body>
</html>
