<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agency Command: Offline</title>
<link rel="icon" href="icons/favicon-32.png" />
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a0d; color:#f3f1f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px; }
  .ring { width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px; background:radial-gradient(circle at 50% 35%, rgba(123,47,247,.25), transparent 70%); }
  .ring img { width:46px; height:46px; object-fit:contain; }
  h1 { font-size:17px;margin:0 0 8px; }
  p { color:#a29dae; font-size:13.5px; line-height:1.5; max-width:280px; margin:0 auto 20px; }
  button { background:linear-gradient(135deg,#7b2ff7,#5c1fd1); color:white; border:none; padding:12px 22px; border-radius:10px; font-weight:700; font-size:14px; }
</style>
</head>
<body>
  <div>
    <div class="ring"><img src="icons/mark.png" alt="" /></div>
    <h1>No connection right now</h1>
    <p>Agency Command needs an internet connection to load live pipeline data. Reconnect and try again, nothing is lost.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
